<h2 mat-dialog-title>{{ data.titulo }}</h2>

<mat-dialog-content>
  <p>{{ data.mensaje }}</p>

  <form [formGroup]="form">
    <mat-form-field appearance="outline">
      <mat-label>{{ data.etiqueta }}</mat-label>
      <textarea
        matInput
        formControlName="motivo"
        rows="3"
        [maxlength]="maxLength"
        cdkFocusInitial
      ></textarea>
      <mat-hint>Queda registrado en la bitácora de la orden.</mat-hint>
      @if (form.controls.motivo.hasError('required')) {
        <mat-error>Escribe el motivo para continuar.</mat-error>
      }
      @if (form.controls.motivo.hasError('maxlength')) {
        <mat-error>Máximo {{ maxLength }} caracteres.</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-flat-button [color]="data.colorConfirmar ?? 'primary'" (click)="confirmar()">
    {{ data.textoConfirmar ?? 'Confirmar' }}
  </button>
</mat-dialog-actions>
