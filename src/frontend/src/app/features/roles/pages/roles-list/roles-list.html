<app-page-header title="Roles" subtitle="Catálogo del sistema — de solo lectura." />

@if (cargando()) {
  <app-list-skeleton [rows]="8" />
} @else if (error()) {
  <app-empty-state
    icon="error_outline"
    tone="error"
    title="No se pudo cargar el catálogo de roles"
    message="Ocurrió un problema al conectar con el servidor. Inténtalo nuevamente."
  >
    <button mat-stroked-button (click)="cargar()">
      <mat-icon>refresh</mat-icon>
      Reintentar
    </button>
  </app-empty-state>
} @else if (roles().length === 0) {
  <app-empty-state icon="admin_panel_settings" message="No hay roles para mostrar." />
} @else {
  <table mat-table [dataSource]="roles()" class="tabla">
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let rol">{{ rol.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef>Descripción</th>
      <td mat-cell *matCellDef="let rol">{{ rol.descripcion ?? '—' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas"></tr>
  </table>
}
