<h2 mat-dialog-title>Asociar orden de trabajo</h2>

<mat-dialog-content>
  <p>
    Busca la orden por N° de OT, RUT o nombre del cliente y elígela para asociarla a este Operativo.
    Solo se puede asociar una orden que tenga Empresa convenio.
  </p>
  <app-selector-orden (seleccionar)="elegir($event)" />
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
</mat-dialog-actions>
